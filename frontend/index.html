<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerSmart Kenya</title>
  <link rel="stylesheet" href="../frontend/styles.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">

    <div class="auth-brand">
      <div class="logo">⚡</div>
      <h1>PowerSmart Kenya</h1>
      <p>Smart Electricity Management System</p>
    </div>

    <div class="auth-card">

      <div class="tab-buttons">
        <button class="tab active" id="loginTab">Login</button>
        <button class="tab" id="registerTab">Register</button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm" class="auth-form">
        <h2>Welcome Back</h2>

        <label>Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="you@example.com"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        >

        <button type="submit" class="primary-button">
          Login
        </button>
      </form>

      <!-- REGISTER -->
      <form id="registerForm" class="auth-form hidden">
        <h2>Create Account</h2>

        <label>Full Name</label>
        <input
          type="text"
          id="registerName"
          placeholder="Full Name"
          required
        >

        <label>Email</label>
        <input
          type="email"
          id="registerEmail"
          placeholder="Email Address"
          required
        >

        <label>Phone Number</label>
        <input
          type="tel"
          id="registerPhone"
          placeholder="254700000000"
          required
        >

        <label>Meter Number</label>
        <input
          type="text"
          id="registerMeter"
          placeholder="37101122093"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="registerPassword"
          placeholder="Password"
          required
        >

        <button type="submit" class="primary-button">
          Create Account
        </button>
      </form>

    </div>

    <footer class="auth-footer">
      © 2026 - Kenya Power. All rights reserved.
    </footer>

  </div>

  <script src="auth.js"></script>

</body>
</html>
