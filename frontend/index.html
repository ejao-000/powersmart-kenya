<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PowerSmart Kenya</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

  <div class="auth-wrapper">

    <!-- ==================================
         BRAND
    =================================== -->

    <div class="auth-brand">

      <div class="logo">
        ⚡
      </div>

      <h1>
        PowerSmart Kenya
      </h1>

      <p>
        Smart Electricity Management System
      </p>

    </div>

    <!-- ==================================
         AUTH CARD
    =================================== -->

    <div class="auth-card">

      <!-- TABS -->

      <div class="tab-buttons">

        <button
          type="button"
          class="tab active"
          id="loginTab">
          Login
        </button>

        <button
          type="button"
          class="tab"
          id="registerTab">
          Sign Up
        </button>

      </div>

      <!-- MESSAGE AREA -->

      <div
        id="authMessage"
        class="auth-message">
      </div>

      <!-- ==================================
           LOGIN FORM
      =================================== -->

      <form
        id="loginForm"
        class="auth-form">

        <h2>
          Welcome Back
        </h2>

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="you@example.com"
          required>

        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required>

        <button
          type="submit"
          class="primary-button">
          Login
        </button>

      </form>

      <!-- ==================================
           REGISTER FORM
      =================================== -->

      <form
        id="registerForm"
        class="auth-form hidden">

        <h2>
          Create Account
        </h2>

        <label for="registerName">
          Full Name
        </label>

        <input
          type="text"
          id="registerName"
          placeholder="John Doe"
          required>

        <label for="registerEmail">
          Email Address
        </label>

        <input
          type="email"
          id="registerEmail"
          placeholder="john@example.com"
          required>

        <label for="registerPhone">
          Phone Number
        </label>

        <input
          type="tel"
          id="registerPhone"
          placeholder="254700000000"
          required>

        <label for="registerMeter">
          Meter Number
        </label>

        <input
          type="text"
          id="registerMeter"
          placeholder="37101122093"
          required>

        <label for="registerPassword">
          Password
        </label>

        <input
          type="password"
          id="registerPassword"
          placeholder="Create Password"
          required>

        <button
          type="submit"
          class="primary-button">
          Create Account
        </button>

      </form>

    </div>

    <!-- ==================================
         FOOTER
    =================================== -->

    <footer class="auth-footer">

      © 2026 - PowerSmart Kenya.
      All rights reserved.

    </footer>

  </div>

  <script src="auth.js"></script>

</body>
</html>
