<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PowerSmart — Kenya Power Smart Dashboard</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body class="auth-body">
  <div class="auth-card">

    <div class="auth-brand">
      <span class="auth-icon">⚡</span>
      <h1>PowerSmart</h1>
      <p>Smart management for your Kenya Power meter</p>
    </div>

    <!-- Tab switcher -->
    <div class="auth-tabs" role="tablist">
      <button class="tab-btn active" data-tab="login"    role="tab" aria-selected="true">Sign In</button>
      <button class="tab-btn"        data-tab="register" role="tab" aria-selected="false">Create Account</button>
    </div>

    <!-- ── Sign In form ─────────────────────────────────────────── -->
    <form id="form-login" class="auth-form active" novalidate>
      <label>
        Email address
        <input type="email" id="login-email" autocomplete="email"
               required placeholder="you@example.com"/>
      </label>
      <label>
        Password
        <div style="position:relative">
          <input type="password" id="login-password" autocomplete="current-password"
                 required placeholder="••••••••" style="padding-right:2.8rem"/>
          <button type="button" class="toggle-pw" data-target="login-password"
                  title="Show / hide password">👁</button>
        </div>
      </label>
      <button type="submit" id="btn-login" class="btn btn-primary btn-full">Sign In</button>
      <p id="login-error" class="form-error hidden"></p>
      <p class="auth-switch">
        Don't have an account?
        <button type="button" class="link-btn" data-switch="register">Create one →</button>
      </p>
    </form>

    <!-- ── Create Account form ──────────────────────────────────── -->
    <form id="form-register" class="auth-form" novalidate>
      <label>
        Full name
        <input type="text" id="reg-name" autocomplete="name"
               required placeholder="Emma Jane"/>
      </label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
        <label>
          Email
          <input type="email" id="reg-email" autocomplete="email"
                 required placeholder="you@example.com"/>
        </label>
        <label>
          Phone
          <input type="tel" id="reg-phone" autocomplete="tel"
                 required placeholder="0712 345 678"/>
        </label>
      </div>
      <label>
        Password
        <div style="position:relative">
          <input type="password" id="reg-password" autocomplete="new-password"
                 required minlength="8" placeholder="Minimum 8 characters"
                 style="padding-right:2.8rem"/>
          <button type="button" class="toggle-pw" data-target="reg-password"
                  title="Show / hide password">👁</button>
        </div>
        <!-- Strength bar -->
        <div class="pw-strength-wrap"><div class="pw-strength-bar" id="pw-strength-bar"></div></div>
        <span class="pw-strength-label" id="pw-strength-label"></span>
      </label>
      <label>
        Kenya Power Meter Account Number
        <input type="text" id="reg-meter-account" inputmode="numeric"
               required pattern="\d{8,12}" placeholder="e.g. 2601234567"
               title="8–12 digit KP account number from your KP statement or meter"/>
        <span class="field-hint">
          Found on your Kenya Power prepaid statement or top of your meter box.
          Only valid KP prepaid accounts are accepted.
        </span>
      </label>
      <button type="submit" id="btn-register" class="btn btn-primary btn-full">Create Account</button>
      <p id="register-error" class="form-error hidden"></p>
      <p class="auth-switch">
        Already have an account?
        <button type="button" class="link-btn" data-switch="login">Sign in →</button>
      </p>
    </form>

  </div><!-- /auth-card -->

  <script type="module">
    import { auth } from './js/api.js';
    import { isLoggedIn, setUser } from './js/store.js';

    // Already logged in → go straight to dashboard
    if (isLoggedIn()) { location.replace('dashboard.html'); }

    // ── Tab / form switching ──────────────────────────────────────────────
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        const isActive = b.dataset.tab === tabName;
        b.classList.toggle('active', isActive);
        b.setAttribute('aria-selected', isActive);
      });
      document.querySelectorAll('.auth-form').forEach(f => {
        f.classList.toggle('active', f.id === `form-${tabName}`);
      });
      // Clear errors when switching
      document.querySelectorAll('.form-error').forEach(e => e.classList.add('hidden'));
    }

    // Tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn =>
      btn.addEventListener('click', () => switchTab(btn.dataset.tab))
    );

    // "Create one →" / "Sign in →" inline links
    document.querySelectorAll('.link-btn[data-switch]').forEach(btn =>
      btn.addEventListener('click', () => switchTab(btn.dataset.switch))
    );

    // Check URL hash to pre-select tab (e.g. index.html#register)
    if (location.hash === '#register') switchTab('register');

    // ── Show / hide password toggle ───────────────────────────────────────
    document.querySelectorAll('.toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const inp = document.getElementById(btn.dataset.target);
        inp.type = inp.type === 'password' ? 'text' : 'password';
        btn.textContent = inp.type === 'password' ? '👁' : '🙈';
      });
    });

    // ── Password strength meter ───────────────────────────────────────────
    document.getElementById('reg-password').addEventListener('input', e => {
      const pw = e.target.value;
      let score = 0;
      if (pw.length >= 8)  score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      score = Math.min(score, 4);
      const colors = ['#c0392b','#e67e22','#f1c40f','#2ecc71','#27ae60'];
      const labels = ['Very weak','Weak','Fair','Good','Strong'];
      const bar = document.getElementById('pw-strength-bar');
      const lbl = document.getElementById('pw-strength-label');
      bar.style.width      = pw ? `${(score / 4) * 100}%` : '0%';
      bar.style.background = colors[score];
      lbl.textContent      = pw ? labels[score] : '';
      lbl.style.color      = colors[score];
    });

    // ── Helpers ───────────────────────────────────────────────────────────
    function setLoading(btnId, loading, loadText = 'Please wait…') {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      if (!btn._orig) btn._orig = btn.textContent;
      btn.textContent = loading ? loadText : btn._orig;
    }
    function showError(elId, msg) {
      const el = document.getElementById(elId);
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function hideError(elId) {
      document.getElementById(elId).classList.add('hidden');
    }

    // ── Sign In ───────────────────────────────────────────────────────────
    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      hideError('login-error');
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showError('login-error', 'Please enter your email and password.'); return;
      }

      setLoading('btn-login', true, 'Signing in…');
      try {
        const res = await auth.login({ email, password });
        localStorage.setItem('ps_token', res.token);
        setUser(res.user);
        location.href = 'dashboard.html';
      } catch (ex) {
        showError('login-error', ex.message || 'Login failed. Check your details and try again.');
        setLoading('btn-login', false);
      }
    });

    // ── Create Account ────────────────────────────────────────────────────
    document.getElementById('form-register').addEventListener('submit', async e => {
      e.preventDefault();
      hideError('register-error');
      const name         = document.getElementById('reg-name').value.trim();
      const email        = document.getElementById('reg-email').value.trim();
      const phone        = document.getElementById('reg-phone').value.trim();
      const password     = document.getElementById('reg-password').value;
      const meterAccount = document.getElementById('reg-meter-account').value.trim();

      // Client-side validation
      if (!name)                              { showError('register-error', 'Please enter your full name.'); return; }
      if (!email)                             { showError('register-error', 'Please enter your email address.'); return; }
      if (!phone)                             { showError('register-error', 'Please enter your phone number.'); return; }
      if (password.length < 8)               { showError('register-error', 'Password must be at least 8 characters.'); return; }
      if (!/^\d{8,12}$/.test(meterAccount))  { showError('register-error', 'Meter account must be 8–12 digits. Check your KP statement.'); return; }

      setLoading('btn-register', true, 'Creating account…');
      try {
        const res = await auth.register({ name, email, phone, password, meter_account: meterAccount });
        localStorage.setItem('ps_token', res.token);
        setUser(res.user);
        location.href = 'dashboard.html';
      } catch (ex) {
        showError('register-error', ex.message || 'Registration failed. Please try again.');
        setLoading('btn-register', false);
      }
    });
  </script>
</body>
</html>
