<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | PowerSmart Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <header class="w-full border-b border-slate-800 bg-slate-950 py-4 px-6 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="h-7 w-7 rounded-lg bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-500 text-xs">🛡️</div>
        <span class="font-mono font-bold text-sm text-white">System Master Telemetry</span>
      </div>
      <button onclick="logoutAdmin()" class="text-xs font-mono text-rose-400 hover:underline">Terminate Session</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full space-y-6">
    <div>
      <span class="text-xs font-mono text-rose-500 uppercase tracking-widest">Restricted Zone</span>
      <h1 class="text-2xl font-mono font-bold text-white mt-1">Global Infrastructure Command</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
        <span class="text-xs font-mono text-slate-400 uppercase">Active Smart Meters</span>
        <h3 class="text-3xl font-mono font-bold text-emerald-400 mt-2">1,420</h3>
      </div>
      <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
        <span class="text-xs font-mono text-slate-400 uppercase">Active Landlord Accounts</span>
        <h3 class="text-3xl font-mono font-bold text-indigo-400 mt-2">84</h3>
      </div>
      <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
        <span class="text-xs font-mono text-slate-400 uppercase">System Error Logs</span>
        <h3 class="text-3xl font-mono font-bold text-rose-400 mt-2">0</h3>
      </div>
    </div>
  </main>

  <footer class="w-full border-t border-slate-800 bg-slate-950 py-4 px-6 text-center text-xs font-mono text-slate-500">
    © 2026 • PowerSmart Kenya. Internal Operations Only.
  </footer>

  <script>
    function logoutAdmin() {
      localStorage.clear();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
