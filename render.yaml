# PowerSmart Kenya — two-service deploy on Render.
#
# The app is split into a pure-API Go backend and a separate static frontend:
#
#   powersmart-frontend  (static HTML/CSS/JS, built by Vite)  →  browser
#              │  window.POWERSMART_API (baked in via VITE_API_URL)
#              ▼
#   powersmart-api       (Go server, /api/* + PostgreSQL)     ←  API
#
# Setup:
#   1. Import this file as a Render Blueprint ("New + → Blueprint"). Render
#      creates the PostgreSQL database below AND both web services automatically.
#      DATABASE_URL is injected from the database, so no manual DB wiring needed.
#   2. After first deploy, set these on powersmart-api:
#        JWT_SECRET            (>= 32 chars) — changing it logs everyone out
#        ADMIN_EMAIL           (to seed the admin account)
#        ADMIN_PASSWORD
#   3. Set CORS_ALLOWED_ORIGINS on powersmart-api to your frontend URL(s).
#      (The Vite dev proxy makes CORS unnecessary in local development.)
#
# NOTE: if you created a Web Service manually instead of importing this
# blueprint, use root dir "backend", build "./build.sh", start "./powersmart"
# and set DATABASE_URL to a hosted PostgreSQL connection string (Render
# Postgres, Neon, Supabase, etc.) — never "localhost", which fails on Render.

# PostgreSQL provisioned and managed by Render. The API service's DATABASE_URL
# is injected from it automatically (the free plan requires ipAllowList: []).
databases:
  - name: powersmart-db
    databaseName: powersmart
    user: powersmart
    plan: free
    ipAllowList: []

services:
  # ── API backend (Go + PostgreSQL) ──────────────────────────────────────
  - type: web
    name: powersmart-api
    runtime: go
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: ./powersmart
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      # DATABASE_URL comes straight from the Render Postgres instance.
      - key: DATABASE_URL
        fromDatabase:
          name: powersmart-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── Frontend (static site served by Vite preview) ─────────────────────
  - type: web
    name: powersmart-frontend
    runtime: node
    rootDir: frontend
    # "sh build.sh" (not "./build.sh") so the script does not need an exec bit
    # set in git (build.sh is tracked from a Windows checkout).
    buildCommand: sh build.sh
    startCommand: npm run preview -- --host 0.0.0.0 --port 10001
    envVars:
      # Point the static site at the API service. Render replaces
      # ${POWERSMART_API_URL} with the powersmart-api service URL.
      - key: VITE_API_URL
        value: ${POWERSMART_API_URL}/api
      - key: POWERSMART_API_URL
        fromService:
          type: web
          name: powersmart-api
          property: host
